<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Udvitha Collections</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#faf7f3;color:#2d241f}
header{background:linear-gradient(135deg,#7b1e3a,#a83b5a);color:white;text-align:center;padding:25px 15px}
h1{margin:0;font-size:30px}.tag{margin:7px 0 0;opacity:.9}
.controls{max-width:1000px;margin:18px auto;padding:0 14px}
.tabs{display:flex;gap:10px;margin-bottom:12px}.tab{flex:1;border:0;border-radius:12px;padding:13px;font-size:16px;font-weight:bold;background:#eadfe2;color:#6b243d;cursor:pointer}.tab.active{background:#7b1e3a;color:#fff}
input{width:100%;padding:13px 15px;border:1px solid #ddd;border-radius:12px;font-size:16px;background:#fff}
.grid{max-width:1000px;margin:auto;padding:0 14px 30px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}
.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 3px 12px #00000012}.photo{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;background:#eee;cursor:pointer}
.info{padding:12px}.code{font-weight:800;color:#7b1e3a}.name{margin:4px 0 10px;font-size:16px}
.wa{display:block;text-align:center;text-decoration:none;background:#188b45;color:#fff;border-radius:10px;padding:10px;font-weight:bold}
.empty{text-align:center;grid-column:1/-1;padding:40px;color:#777}
footer{text-align:center;padding:20px;color:#777;font-size:13px}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<header><h1>Udvitha Collections</h1><div class="tag">Elegant Sarees • Beautiful Jewellery • Easy Ordering on WhatsApp</div></header>
<div class="controls">
  <div class="tabs">
    <button class="tab active" data-cat="sarees">👗 Sarees</button>
    <button class="tab" data-cat="jewellery">💎 Jewellery</button>
  </div>
  <input id="search" type="search" placeholder="Search by code or name…">
</div>
<main id="grid" class="grid"></main>
<footer>© Udvitha Collections • Enquiries on WhatsApp</footer>
<script>
const WA="919502747565";
const products=[
 {cat:"sarees",code:"S001",name:"Green & Yellow Saree",img:"S001.jpg"},
 {cat:"sarees",code:"S002",name:"Red & White Saree",img:"S002.jpg"},
 {cat:"sarees",code:"S003",name:"Yellow & Pink Saree",img:"S003.jpg"},
 {cat:"sarees",code:"S004",name:"Royal Blue Saree",img:"S004.jpg"},
 {cat:"jewellery",code:"J001",name:"Sample Necklace",img:"J001.svg"},
 {cat:"jewellery",code:"J002",name:"Sample Bangles",img:"J002.svg"},
 {cat:"jewellery",code:"J003",name:"Sample Earrings",img:"J003.svg"}
];
let category="sarees";
function render(){
 const q=document.getElementById("search").value.trim().toLowerCase();
 const list=products.filter(p=>p.cat===category && (!q || (p.code+" "+p.name).toLowerCase().includes(q)));
 const grid=document.getElementById("grid");
 grid.innerHTML=list.length?list.map(p=>{
   const msg=encodeURIComponent("Hi Udvitha Collections, I am interested in "+p.code+" - "+p.name);
   return `<article class="card"><img class="photo" src="${p.img}" alt="${p.code} ${p.name}" onclick="window.open(this.src,'_blank')"><div class="info"><div class="code">${p.code}</div><div class="name">${p.name}</div><a class="wa" target="_blank" href="https://wa.me/${WA}?text=${msg}">💬 WhatsApp Enquiry</a></div></article>`
 }).join(""):`<div class="empty">No items found.</div>`;
}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{category=b.dataset.cat;document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");document.getElementById("search").value="";render()});
document.getElementById("search").oninput=render; render();
</script>
</body></html>
