<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Udvitha Collections</title><style>body{margin:0;font-family:Arial;background:#fff8fb;color:#333}header{background:linear-gradient(135deg,#8e245d,#c94f87);color:#fff;text-align:center;padding:24px 14px}h1{margin:0 0 7px}.notice{max-width:900px;margin:14px auto;padding:12px;text-align:center;background:#fff;border-radius:12px;box-shadow:0 2px 10px #0001}.tabs{display:flex;justify-content:center;gap:10px;margin:16px}.tab{border:0;border-radius:22px;padding:10px 20px;background:#eee;font-weight:bold}.active{background:#8e245d;color:#fff}.controls{max-width:900px;margin:10px auto 20px;padding:0 14px}#search{width:100%;padding:13px;border:1px solid #ddd;border-radius:25px;font-size:15px}.grid{max-width:1100px;margin:auto;padding:0 14px 30px;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}.card{background:#fff;border-radius:15px;overflow:hidden;box-shadow:0 3px 12px #0002}.photo{width:100%;aspect-ratio:1;object-fit:cover;cursor:pointer}.info{padding:13px}.code{font-weight:bold;color:#8e245d}.price{font-size:20px;font-weight:bold;margin:5px 0 11px}.dm{display:block;text-align:center;text-decoration:none;background:#8e245d;color:#fff;padding:10px;border-radius:9px;font-weight:bold}.empty{text-align:center;padding:35px;color:#777;grid-column:1/-1}footer{text-align:center;padding:22px;background:#f3e5ec;color:#666;font-size:13px}@media(max-width:500px){.grid{grid-template-columns:repeat(2,1fr);gap:10px;padding:0 9px 25px}.info{padding:9px}.price{font-size:17px}.dm{font-size:13px;padding:9px}}</style></head><body><header><h1>Udvitha Collections</h1><p>Elegant Sarees • Beautiful Jewellery • Easy Ordering on Instagram</p></header><div class="notice">💎 Interested in any of our collections? Tap <b>“📩 DM to Enquire”</b> below to enquire on Instagram.</div><div class="tabs"><button class="tab active" id="sareeTab">👗 Sarees</button><button class="tab" id="jewelTab">💎 Jewellery</button></div><div class="controls"><input id="search" type="search" placeholder="Search by code or name..."></div><div id="grid" class="grid"><div class="empty">Loading collections...</div></div><footer>© Udvitha Collections • Instagram DM for enquiries<br>@udvi_creations_trendz</footer><script>const API='https://api.github.com/repos/udvithacollections/UdvithaCollections/contents/';const BASE='https://udvithacollections.github.io/UdvithaCollections/';let all=[],cat='S';const money=n=>'₹'+Number(n).toLocaleString('en-IN');async function load(){let r=await fetch(API);if(!r.ok)throw Error();let f=await r.json();all=f.map(x=>{let m=x.name.match(/^([SJ]\d+)_([0-9]+(?:\.[0-9]+)?)\.(jpg|jpeg|png|webp|gif|svg)$/i);return m?{code:m[1].toUpperCase(),price:m[2],file:x.name}:null}).filter(Boolean);render()}function render(){let q=search.value.toLowerCase().trim(),a=all.filter(p=>p.code.startsWith(cat)&&p.code.toLowerCase().includes(q));if(!a.length){grid.innerHTML='<div class="empty">No products found.</div>';return}grid.innerHTML=a.map(p=>{let img=BASE+encodeURIComponent(p.file);return '<div class="card"><img class="photo" src="'+img+'" alt="'+p.code+'" onclick="window.open(this.src,\'_blank\')"><div class="info"><div class="code">'+p.code+'</div><div class="price">'+money(p.price)+'</div><a class="dm" href="https://ig.me/m/udvi_creations_trendz" target="_blank" rel="noopener">📩 DM to Enquire</a></div></div>'}).join('')}search.oninput=render;sareeTab.onclick=()=>{cat='S';sareeTab.classList.add('active');jewelTab.classList.remove('active');render()};jewelTab.onclick=()=>{cat='J';jewelTab.classList.add('active');sareeTab.classList.remove('active');render()};load().catch(()=>grid.innerHTML='<div class="empty">Catalogue could not be loaded. Please check the GitHub repository.</div>');</script></body></html>
